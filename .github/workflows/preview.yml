name: Publish Preview
on:
  workflow_dispatch:
    inputs:
      version:
        description: New channel tag to publish
        type: string
        required: true
      source_sha:
        description: Full commit SHA of preview HEAD
        type: string
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: ./.github/workflows/release-pipeline.yml
    with:
      channel: preview
      source: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
