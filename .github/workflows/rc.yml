name: Publish Rc
on:
  workflow_dispatch:
    inputs:
      version:
        description: New RC tag to publish
        type: string
        required: true
      preview_tag:
        description: Preview tag that passed full verification
        type: string
        required: true
      observation_override_reason:
        description: Observation period override reason; normally left blank
        type: string
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: ./.github/workflows/release-pipeline.yml
    secrets:
      DISCORD_WEBHOOK_PREVIEW: ${{ secrets.DISCORD_WEBHOOK_PREVIEW }}
      DISCORD_WEBHOOK_RC: ${{ secrets.DISCORD_WEBHOOK_RC }}
      DISCORD_WEBHOOK_RELEASE: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
    with:
      channel: rc
      source: ${{ inputs.preview_tag }}
      version: ${{ inputs.version }}
      observation_override_reason: ${{ inputs.observation_override_reason }}
