name: Publish Stable
on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: RC tag that passed full verification
        type: string
        required: true
      observation_override_reason:
        description: Observation period override reason; normally left blank
        type: string
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: ./.github/workflows/release-pipeline.yml
    with:
      channel: stable
      source: ${{ inputs.rc_tag }}
      observation_override_reason: ${{ inputs.observation_override_reason }}
