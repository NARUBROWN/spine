name: Publish Stable
on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 전체 검증을 마친 RC 태그
        type: string
        required: true
      observation_override_reason:
        description: 관찰 기간 단축 사유, 평소에는 비움
        type: string
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: ./.github/workflows/release-pipeline.yml
    with:
      channel: stable
      source: ${{ inputs.rc_tag }}
      observation_override_reason: ${{ inputs.observation_override_reason }}
