name: Core Release Pipeline
on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      version:
        type: string
        default: ''
      source:
        type: string
        required: true
      observation_override_reason:
        type: string
        default: ''
    secrets:
      DISCORD_WEBHOOK_PREVIEW:
        required: false
      DISCORD_WEBHOOK_RC:
        required: false
      DISCORD_WEBHOOK_RELEASE:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Validate exact source, channel and dependency pins
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_OVERRIDE_REASON: ${{ inputs.observation_override_reason }}
        run: go run ./scripts/release/workspace plan
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error
  core-ci:
    needs: plan
    uses: ./.github/workflows/release-core-check.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
  public-before-tag:
    needs: plan
    uses: ./.github/workflows/release-public-check.yml
    with:
      source_sha: ${{ needs.plan.outputs.sha }}
      query: ${{ needs.plan.outputs.sha }}
      artifact: public-before-tag
      scope: core
  tag:
    needs: [plan, core-ci, public-before-tag]
    if: ${{ always() && needs.plan.result == 'success' && needs.core-ci.result == 'success' && needs.public-before-tag.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    environment: ${{ inputs.channel == 'stable' && 'release-stable' || format('release-{0}', inputs.channel) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Create immutable tag after source verification
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.core-ci.outputs.verified_sha }}
        run: go run ./scripts/release/workspace tag
      - name: Notify Discord of the new tag
        uses: ./.github/actions/discord-tag
        continue-on-error: true
        timeout-minutes: 1
        with:
          plan: release-plan.json
          webhook_preview: ${{ secrets.DISCORD_WEBHOOK_PREVIEW }}
          webhook_rc: ${{ secrets.DISCORD_WEBHOOK_RC }}
          webhook_release: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
  public:
    needs: [plan, tag]
    uses: ./.github/workflows/release-public-check.yml
    with:
      source_sha: ${{ needs.plan.outputs.sha }}
      query: ${{ needs.plan.outputs.version }}
      artifact: public-after-tag
      scope: core
  finish:
    needs: [plan, tag, public]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - uses: actions/download-artifact@v4
        with:
          name: public-after-tag
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Record core candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./scripts/release/record
      - uses: actions/upload-artifact@v4
        with:
          name: core-candidate-${{ needs.plan.outputs.version }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
