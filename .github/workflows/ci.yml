name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to verify
        type: string
        required: true
      public_dependencies:
        type: boolean
        default: false
    outputs:
      verified_sha:
        description: Commit that passed all checks
        value: ${{ jobs.verified.outputs.sha }}
  push:
    branches: [preview, rc, main]
    tags:
      - "v*"
  pull_request:
    branches: [preview, rc, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: '1'
  GOWORK: "off"

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: spine

jobs:
  branch-direction:
    name: Branch Direction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: node scripts/release/branch_flow.cjs
        working-directory: .

  quality:
    needs: branch-direction
    name: Formatting, Vet, and Modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout Spine
        uses: actions/checkout@v4
        with:
          path: spine
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Prepare pinned contract sources
        uses: ./spine/.github/actions/setup-sources
        with:
          published: ${{ inputs.public_dependencies && 'true' || 'false' }}
          ref: ${{ github.base_ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: spine/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . ../spine-echo-platform)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify embedded documentation assets and notices
        run: |
          go run ./scripts/openapi-ui --check
          go test ./scripts/openapi-ui
          node --test scripts/openapi-ui/test_bundle.cjs
          go test ./scripts/httpverify

      - name: Run go vet
        run: |
          for module in . test test/platform-e2e test/openapi cmd/demo cmd/reference examples/security-config; do
            go run ./scripts/test -module "$module" vet ./...
          done
          go -C ../spine-echo-platform vet ./...
          bash scripts/check-module-boundaries.sh

      - name: Verify source workspace boundaries
        run: go run ./scripts/release/workspace check --root .

  unit:
    needs: branch-direction
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout Spine
        uses: actions/checkout@v4
        with:
          path: spine
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Prepare pinned contract sources
        uses: ./spine/.github/actions/setup-sources
        with:
          published: ${{ inputs.public_dependencies && 'true' || 'false' }}
          ref: ${{ github.base_ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: spine/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        shell: bash
        run: |
          for module in . cmd/reference examples/security-config; do
            go run ./scripts/test -module "$module" test ./... -count=1 -shuffle=on -timeout=8m
          done
          go -C ../spine-echo-platform test ./... -count=1 -shuffle=on -timeout=8m
          go run ./scripts/test -module cmd/demo test ./... -run '^TestBuildApplication$' -count=1 -shuffle=on -timeout=8m

  integration:
    needs: branch-direction
    name: Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout Spine
        uses: actions/checkout@v4
        with:
          path: spine
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Prepare pinned contract sources
        uses: ./spine/.github/actions/setup-sources
        with:
          published: ${{ inputs.public_dependencies && 'true' || 'false' }}
          ref: ${{ github.base_ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: spine/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        run: go -C test test ./... -run '^TestAppIntegration_' -count=1 -shuffle=on -timeout=8m

  e2e:
    needs: branch-direction
    name: End-to-End Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout Spine
        uses: actions/checkout@v4
        with:
          path: spine
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Prepare pinned contract sources
        uses: ./spine/.github/actions/setup-sources
        with:
          published: ${{ inputs.public_dependencies && 'true' || 'false' }}
          ref: ${{ github.base_ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: spine/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Download demo dependencies
        run: go -C cmd/demo mod download all

      # CLI 명세 분석 연동은 후속 범위이며 여기서는 코어의 실제 앱 실행을 검증합니다.
      - name: Run real-network demo E2E tests
        run: go run ./scripts/test -module cmd/demo test . -run '^TestDemoE2E_' -count=1 -timeout=8m

  race:
    needs: branch-direction
    name: Race Detector (Go 1.27.3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout Spine
        uses: actions/checkout@v4
        with:
          path: spine
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Prepare pinned contract sources
        uses: ./spine/.github/actions/setup-sources
        with:
          published: ${{ inputs.public_dependencies && 'true' || 'false' }}
          ref: ${{ github.base_ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: "**/go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Run race detector
        run: |
          for module in . test cmd/demo cmd/reference examples/security-config; do
            go run ./scripts/test -module "$module" test -race ./... -count=1 -shuffle=on -timeout=12m
          done
          go -C ../spine-echo-platform test -race ./... -count=1 -shuffle=on -timeout=12m

  event-platform-e2e:
    needs: branch-direction
    name: HTTP, WS, Event, and Validator Platform E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout Spine
        uses: actions/checkout@v4
        with:
          path: spine
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Prepare pinned contract sources
        uses: ./spine/.github/actions/setup-sources
        with:
          published: ${{ inputs.public_dependencies && 'true' || 'false' }}
          ref: ${{ github.base_ref || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: "**/go.sum"
      - name: Start Redpanda
        run: |
          docker run -d --name event-kafka -p 127.0.0.1:19092:9092 redpandadata/redpanda:v24.3.18 redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr 127.0.0.1:19092
          for attempt in $(seq 1 60); do
            if docker exec event-kafka rpk cluster info -X brokers=127.0.0.1:9092 >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs event-kafka
          exit 1
      - name: Start NATS JetStream
        shell: bash
        run: |
          docker run -d --name event-nats -p 127.0.0.1:4222:4222 nats:2.11 -js
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs event-nats
          exit 1
      - name: HTTP publication, worker redelivery and result events
        env:
          SPINE_TEST_KAFKA_BROKER: 127.0.0.1:19092
          SPINE_TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
        run: go -C test test -race . -run '^TestAppEventLive_' -count=1 -timeout=2m
      - name: Validator, HTTP, WebSocket and broker contracts together
        env:
          SPINE_TEST_KAFKA_BROKER: 127.0.0.1:19092
          SPINE_TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
        run: go -C test/platform-e2e test -race -v ./... -count=1 -timeout=3m

      - name: NATS JetStream HTTP and worker event flow
        env:
          SPINE_TEST_NATS_URL: nats://127.0.0.1:4222
        run: go -C test/nats-e2e test -race -v ./... -count=1 -timeout=3m

      - name: OpenAPI schemas and actual HTTP behavior
        run: go -C test/openapi test -race -v ./... -count=1 -timeout=3m

  http-platforms:
    needs: branch-direction
    name: HTTP and TLS Platform E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: spine
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./spine/.github/actions/setup-sources
        with:
          published: ${{ inputs.public_dependencies && 'true' || 'false' }}
          ref: ${{ github.base_ref || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: "**/go.sum"
      - name: Verify net/http and shared HTTP and TLS behavior
        run: |
          go -C ../spine-nethttp-platform vet ./...
          go -C ../spine-nethttp-platform test -race ./... -count=1 -timeout=2m
          go -C test/http-platform vet ./...
          go -C test/http-platform test -race ./... -count=1 -timeout=2m

  release-policy:
    needs: branch-direction
    name: Release Policy and Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
        working-directory: .
      - run: actionlint -shellcheck= -pyflakes=
        working-directory: .
      - run: go run ./scripts/release/workspace validate-policy
        working-directory: .
      - name: Verify source dependency channel
        working-directory: .
        env:
          CHANNEL_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          channel=$(go run ./scripts/release/workspace channel --ref "$CHANNEL_REF")
          go run ./scripts/release/workspace check-module --channel "$channel"
      - run: go run ./scripts/release/branches --check-environment
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
      - run: go test ./.github/actions/discord-tag ./scripts/verifiedsource ./scripts/release/...
        working-directory: .
      - run: node --test scripts/release/branch_flow.test.cjs
        working-directory: .

  verified:
    name: ${{ github.event_name == 'pull_request' && format('Verified Source / {0}', github.base_ref) || 'Verified Source' }}
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [branch-direction, quality, unit, integration, e2e, race, event-platform-e2e, http-platforms, release-policy]
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
        id: source
        working-directory: .
        run: go run ./scripts/verifiedsource
