name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GOWORK: "off"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: spine

jobs:
  quality:
    name: Formatting, Vet, and Modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout Spine
        uses: actions/checkout@v4
        with:
          path: spine

      - name: Checkout Echo integration
        uses: actions/checkout@v4
        with:
          repository: NARUBROWN/spine-echo-platform
          ref: v0.1.0
          path: spine-echo-platform

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: spine/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . ../spine-echo-platform)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Prepare platform workspace
        shell: bash
        run: |
          platform_workspace="$RUNNER_TEMP/spine-platform"
          mkdir -p "$platform_workspace"
          go -C "$platform_workspace" work init "$GITHUB_WORKSPACE/spine" "$GITHUB_WORKSPACE/spine-echo-platform"
          local_spine=$(GOWORK="$platform_workspace/go.work" go -C ../spine-echo-platform list -m -f '{{.Main}}' github.com/NARUBROWN/spine)
          test "$local_spine" = true

      - name: Run go vet
        run: |
          for module in . test test/platform-e2e cmd/demo cmd/reference examples/security-config; do
            go -C "$module" vet ./...
          done
          GOWORK="$RUNNER_TEMP/spine-platform/go.work" go -C ../spine-echo-platform vet ./...
          bash scripts/check-module-boundaries.sh

      - name: Check module files
        run: |
          for module in . ../spine-echo-platform test test/platform-e2e cmd/demo cmd/reference examples/security-config; do
            go -C "$module" mod verify
            go -C "$module" mod tidy
          done
          git diff --exit-code -- go.mod go.sum ':(glob)**/go.mod' ':(glob)**/go.sum'
          git -C ../spine-echo-platform diff --exit-code -- go.mod go.sum
          test "$(go -C ../spine-echo-platform list -m -f '{{.Main}}' github.com/NARUBROWN/spine)" = false
          test -z "$(go -C ../spine-echo-platform list -m -f '{{if .Replace}}{{.Path}}{{end}}' all)"

  unit:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout Spine
        uses: actions/checkout@v4
        with:
          path: spine

      - name: Checkout Echo integration
        uses: actions/checkout@v4
        with:
          repository: NARUBROWN/spine-echo-platform
          ref: v0.1.0
          path: spine-echo-platform

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: spine/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Prepare platform workspace
        shell: bash
        run: |
          platform_workspace="$RUNNER_TEMP/spine-platform"
          mkdir -p "$platform_workspace"
          go -C "$platform_workspace" work init "$GITHUB_WORKSPACE/spine" "$GITHUB_WORKSPACE/spine-echo-platform"
          local_spine=$(GOWORK="$platform_workspace/go.work" go -C ../spine-echo-platform list -m -f '{{.Main}}' github.com/NARUBROWN/spine)
          test "$local_spine" = true

      - name: Run unit tests
        shell: bash
        run: |
          for module in . cmd/reference examples/security-config; do
            go -C "$module" test ./... -count=1 -shuffle=on -timeout=8m
          done
          GOWORK="$RUNNER_TEMP/spine-platform/go.work" go -C ../spine-echo-platform test ./... -count=1 -shuffle=on -timeout=8m
          go -C cmd/demo test ./... -run '^TestBuildApplication$' -count=1 -shuffle=on -timeout=8m

  integration:
    name: Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout Spine
        uses: actions/checkout@v4
        with:
          path: spine

      - name: Checkout Echo integration
        uses: actions/checkout@v4
        with:
          repository: NARUBROWN/spine-echo-platform
          ref: v0.1.0
          path: spine-echo-platform

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: spine/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        run: go -C test test ./... -run '^TestAppIntegration_' -count=1 -shuffle=on -timeout=8m

  e2e:
    name: End-to-End Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout Spine
        uses: actions/checkout@v4
        with:
          path: spine

      - name: Checkout Echo integration
        uses: actions/checkout@v4
        with:
          repository: NARUBROWN/spine-echo-platform
          ref: v0.1.0
          path: spine-echo-platform

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: spine/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Download demo dependencies
        run: go -C cmd/demo mod download all

      - name: Install pinned Spine CLI
        run: go install github.com/NARUBROWN/spine-cli/cmd/spine@v0.4.0

      - name: Verify demo CLI contract
        run: |
          spine context --root cmd/demo --json
          spine contract check --root cmd/demo --warnings-as-errors --json
          spine verify --root cmd/demo --warnings-as-errors --json
          spine contract probe --root cmd/demo --json

      - name: Run real-network demo E2E tests
        run: go -C cmd/demo test . -run '^TestDemoE2E_' -count=1 -timeout=8m

  race:
    name: Race Detector (Go 1.27.3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout Spine
        uses: actions/checkout@v4
        with:
          path: spine

      - name: Checkout Echo integration
        uses: actions/checkout@v4
        with:
          repository: NARUBROWN/spine-echo-platform
          ref: v0.1.0
          path: spine-echo-platform

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: "**/go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Prepare platform workspace
        shell: bash
        run: |
          platform_workspace="$RUNNER_TEMP/spine-platform"
          mkdir -p "$platform_workspace"
          go -C "$platform_workspace" work init "$GITHUB_WORKSPACE/spine" "$GITHUB_WORKSPACE/spine-echo-platform"
          local_spine=$(GOWORK="$platform_workspace/go.work" go -C ../spine-echo-platform list -m -f '{{.Main}}' github.com/NARUBROWN/spine)
          test "$local_spine" = true

      - name: Run race detector
        run: |
          for module in . test cmd/demo cmd/reference examples/security-config; do
            go -C "$module" test -race ./... -count=1 -shuffle=on -timeout=12m
          done
          GOWORK="$RUNNER_TEMP/spine-platform/go.work" go -C ../spine-echo-platform test -race ./... -count=1 -shuffle=on -timeout=12m

  event-platform-e2e:
    name: HTTP, Event, and Validator Platform E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout Spine
        uses: actions/checkout@v4
        with:
          path: spine
      - name: Checkout Echo integration
        uses: actions/checkout@v4
        with:
          repository: NARUBROWN/spine-echo-platform
          ref: v0.1.0
          path: spine-echo-platform
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: "**/go.sum"
      - name: Start Redpanda
        run: |
          docker run -d --name event-kafka -p 127.0.0.1:19092:9092 redpandadata/redpanda:v24.3.18 redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr 127.0.0.1:19092
          for attempt in $(seq 1 60); do
            if docker exec event-kafka rpk cluster info -X brokers=127.0.0.1:9092 >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs event-kafka
          exit 1
      - name: HTTP publication, worker redelivery and result events
        env:
          SPINE_TEST_KAFKA_BROKER: 127.0.0.1:19092
          SPINE_TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
        run: go -C test test -race . -run '^TestAppEventLive_' -count=1 -timeout=2m
      - name: Validator, HTTP, WebSocket and broker contracts together
        env:
          SPINE_TEST_KAFKA_BROKER: 127.0.0.1:19092
          SPINE_TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
        run: go -C test/platform-e2e test -race -v ./... -count=1 -timeout=3m
