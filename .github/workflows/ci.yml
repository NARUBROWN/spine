name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, Vet, and Modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Check module files
        run: |
          go mod verify
          go mod tidy
          go -C cmd/demo mod verify
          go -C cmd/demo mod tidy
          git diff --exit-code -- go.mod go.sum cmd/demo/go.mod cmd/demo/go.sum

  unit:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        shell: bash
        run: |
          packages=$(go list ./... | grep -v '/test$')
          if [ -z "$packages" ]; then
            echo "No package to test."
            exit 0
          fi
          go test $packages -count=1 -shuffle=on -timeout=8m
          go -C cmd/demo test ./... -run '^TestBuildApplication$' -count=1 -shuffle=on -timeout=8m

  integration:
    name: Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        run: go test ./test -run '^TestAppIntegration_' -count=1 -shuffle=on -timeout=8m

  e2e:
    name: End-to-End Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Download demo dependencies
        run: go -C cmd/demo mod download

      - name: Install pinned Spine CLI
        run: go install github.com/NARUBROWN/spine-cli/cmd/spine@f577772078d56595c179c6c53c46ee78cfeea4fa

      - name: Verify demo CLI contract
        run: |
          spine context --root cmd/demo --json
          spine contract check --root cmd/demo --warnings-as-errors --json
          spine verify --root cmd/demo --warnings-as-errors --json
          spine contract probe --root cmd/demo --json

      - name: Run real-network demo E2E tests
        run: go -C cmd/demo test . -run '^TestDemoE2E_' -count=1 -timeout=8m

  race:
    name: Race Detector (Go 1.27.3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run race detector
        run: |
          go test -race ./... -count=1 -shuffle=on -timeout=12m
          go -C cmd/demo test -race ./... -count=1 -shuffle=on -timeout=12m
